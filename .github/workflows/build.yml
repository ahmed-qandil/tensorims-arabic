name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK components
        run: |
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o ct.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          rm -rf latest && mkdir latest && unzip -q ct.zip -d latest && mv latest/cmdline-tools/* latest/ && rm -rf latest/cmdline-tools ct.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Package artifacts
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release-unsigned.apk "out/TensorIMS-v4.0.2-ar1-unsigned.apk"
          git archive --format=zip -o "out/TensorIMS-v4.0.2-ar1-source.zip" HEAD
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v4.0.2-ar1
          git push -f origin v4.0.2-ar1
          gh release delete v4.0.2-ar1 --yes 2>/dev/null || true
          gh release create v4.0.2-ar1 --title "TensorIMS v4.0.2-ar1 (Arabic)" --notes "Unsigned Arabic build of TensorIMS 4.0.2. See MODIFICATIONS.md." out/*.apk out/*.zip --latest
